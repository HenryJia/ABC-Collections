name: Build ABC to PS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install ABC tools
      run: |
        sudo apt-get update
        # Install ABC tools for conversion to PS
        sudo apt-get install -y abcm2ps
        
    - name: Convert ABC files to PS
      run: |
        mkdir -p assets/pdf
        echo "Starting ABC to PS conversion..."
        
        # Count total ABC files
        total_files=$(find assets/abc -name "*.abc" | wc -l)
        echo "Found $total_files ABC files to process"
        
        # Convert each ABC file to PS with error ignoring
        for abc_file in assets/abc/*.abc; do
          if [ -f "$abc_file" ]; then
            echo "Processing $abc_file..."
            # Get the base name without extension
            base_name=$(basename "$abc_file" .abc)
            echo "Base name: $base_name"
            
            abcm2ps "$abc_file" -O "$(base_name).ps"

            # Check the PS file was produced
            if [ -f "${base_name}.ps" ]; then
              echo "Successfully converted $abc_file to PS format (errors ignored)"
              
              # Convert PS to PDF (since we want PDFs in the final output)
              if ps2pdf "${base_name}.ps" "assets/pdf/${base_name}.pdf"; then
                echo "Successfully generated PDF for $abc_file"
              else
                echo "Error: Failed to convert PS to PDF for $abc_file"
              fi
            else
              echo "Error: Failed to convert $abc_file to PS format"
            fi
          fi
        done
        
        echo "ABC to PS conversion complete"
        
    - name: Commit and push changes
      if: success()
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add assets/pdf/
        git commit -m "Build PDFs from ABC files using PS (errors ignored)" || echo "No changes to commit"
        git push origin main || echo "No changes to push"